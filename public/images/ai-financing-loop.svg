<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">NVIDIA is on both sides of the sale</text>

  <!-- Panel A -->
  <text x="30" y="120" font-size="16" font-weight="bold" fill="#333">1 · Investing in the customer</text>

  <!-- Panel A arrows -->
  <path d="M 200 212 L 445 298" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 800 212 L 555 298" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 602 315 C 705 318, 790 270, 800 214" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 718 157 C 620 96, 380 96, 284 154" stroke="#555" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>

  <!-- Panel A arrow labels -->
  <text x="268" y="250" text-anchor="middle" font-size="14" fill="#333">$10B investment</text>
  <text x="732" y="248" text-anchor="middle" font-size="14" fill="#333">$5B investment</text>
  <text x="742" y="338" text-anchor="middle" font-size="14" fill="#333">$30B Azure compute</text>
  <text x="500" y="88" text-anchor="middle" font-size="13" fill="#777" font-style="italic">Microsoft buys more NVIDIA systems</text>

  <!-- Panel A boxes -->
  <g>
    <rect x="80" y="150" width="200" height="60" rx="10" fill="#d7302a"/>
    <text x="180" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">NVIDIA</text>
    <text x="180" y="196" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">the supplier</text>
  </g>
  <g>
    <rect x="720" y="150" width="200" height="60" rx="10" fill="#1a1a1a"/>
    <text x="820" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Microsoft</text>
    <text x="820" y="196" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">the cloud</text>
  </g>
  <g>
    <rect x="400" y="300" width="200" height="60" rx="10" fill="#f0efec" stroke="#c9c7c2"/>
    <text x="500" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Anthropic</text>
    <text x="500" y="346" text-anchor="middle" font-size="11" fill="#555">the model lab</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="405" x2="970" y2="405" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Panel B -->
  <text x="30" y="440" font-size="16" font-weight="bold" fill="#333">2 · Backstopping the reseller</text>

  <!-- Panel B arrows -->
  <path d="M 282 475 L 718 475" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 718 505 L 282 505" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 180 522 C 320 588, 680 588, 818 524" stroke="#555" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>

  <!-- Panel B arrow labels -->
  <text x="500" y="465" text-anchor="middle" font-size="14" fill="#333">takes an equity stake</text>
  <text x="500" y="525" text-anchor="middle" font-size="14" fill="#333">buys GPUs, rents them out</text>
  <text x="500" y="582" text-anchor="middle" font-size="13" fill="#777" font-style="italic">buyer of last resort for qualifying unsold capacity (initial $6.3B)</text>

  <!-- Panel B boxes -->
  <g>
    <rect x="80" y="460" width="200" height="60" rx="10" fill="#d7302a"/>
    <text x="180" y="486" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">NVIDIA</text>
    <text x="180" y="506" text-anchor="middle" font-size="11" fill="#fff" opacity="0.85">the supplier</text>
  </g>
  <g>
    <rect x="720" y="460" width="200" height="60" rx="10" fill="#f0efec" stroke="#c9c7c2"/>
    <text x="820" y="486" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">CoreWeave</text>
    <text x="820" y="506" text-anchor="middle" font-size="11" fill="#555">the neocloud</text>
  </g>

  <!-- Footer -->
  <text x="30" y="645" font-size="13" fill="#999">Sources: Microsoft / NVIDIA / Anthropic announcement (Nov 2025) · OpenAI announcement · Wikipedia: AI build-out financing · Chart: Lifetime Rookie</text>
</svg>
